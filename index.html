<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霓虹裂隙 Neon Rift</title>
</head>
<body>
<div id="cross" class="hidden"></div>
<div id="floaters"></div>
<div id="vignette"></div>
<div id="fade"></div>

<div id="hud" class="hidden">
  <div id="tl">
    <div class="label">HULL <span id="shieldPip" class="hidden">◆ 护盾</span></div>
    <div class="bar"><div id="hpFill"></div></div>
    <div id="hpText"></div>
    <div class="label">DASH</div>
    <div class="bar small"><div id="dashFill"></div></div>
  </div>
  <div id="tr">
    <div>房间 <b id="roomN">1</b> <span id="roomLabel" class="dim"></span></div>
    <div>分数 <b id="score">0</b></div>
    <div>金币 <b id="coins" class="gold">0</b></div>
    <div class="dim">最佳纪录：<span id="best">-</span></div>
  </div>
  <div id="bossBar" class="hidden"><div class="name" id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
  <div id="combo" class="hidden"><b id="comboN">0</b><span>连杀</span><div class="bar tiny"><div id="comboFill"></div></div></div>
  <div id="prompt" class="hidden"></div>
  <div id="weapons"></div>
  <div id="buffs"></div>
  <div id="toast"></div>
</div>

<div id="titleScreen" class="overlay">
  <h1>NEON RIFT</h1>
  <div class="sub">霓虹裂隙 · 俯视角 Roguelite 射击</div>
  <div class="controls">
    <kbd>WASD</kbd><span>移动</span>
    <kbd>鼠标</kbd><span>瞄准 / 左键射击</span>
    <kbd>空格 / 右键</kbd><span>冲刺（无敌帧）</span>
    <kbd>1 2 3 / Q / 滚轮</kbd><span>切换武器</span>
    <kbd>E</kbd><span>拾取武器 / 购买商品</span>
    <kbd>Esc / P</kbd><span>暂停（查看属性与设置）</span>
  </div>
  <div class="tips">每 5 个房间一个首领 · 第 3、8、13… 个房间是商店 · 重复拾取同一把武器会升级</div>
  <button class="go" id="startBtn">开 始</button>
</div>

<div id="upgradeScreen" class="overlay hidden">
  <h2 id="upgradeTitle">选择一项强化</h2>
  <div id="cards"></div>
</div>

<div id="pauseScreen" class="overlay hidden">
  <h2>已暂停</h2>
  <div class="pausegrid">
    <div class="panel"><h3>机体数据</h3><div id="statList"></div></div>
    <div class="panel"><h3>已获得强化</h3><div id="buildList"></div></div>
    <div class="panel">
      <h3>设置</h3>
      <label class="opt">音量 <input type="range" id="optVolume" min="0" max="100"></label>
      <label class="opt"><input type="checkbox" id="optShake"> 屏幕震动</label>
      <label class="opt"><input type="checkbox" id="optNumbers"> 伤害数字</label>
    </div>
  </div>
  <button class="go" id="resumeBtn">继 续</button>
</div>

<div id="deadScreen" class="overlay hidden">
  <h2 style="color:#ff4d6d">机体损毁</h2>
  <div class="stats" id="deadStats"></div>
  <button class="go" id="restartBtn">再来一局</button>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
